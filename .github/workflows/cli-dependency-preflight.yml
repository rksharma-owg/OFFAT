name: CLI dependency preflight
on:
  push:
    branches: [codex/cli-dependency-preflight]
permissions:
  contents: read
env:
  PATCH_SHA: 0a0010c72490776c32dd4ee7e74343046981b3e6
  BASE_SHA: aa4a88640a99411dfce931e7187df921f9926dfb
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0a0010c72490776c32dd4ee7e74343046981b3e6
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact patch and baseline
        run: |
          test "$(git rev-parse HEAD)" = "$PATCH_SHA"
          test "$(git merge-base "$BASE_SHA" "$PATCH_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA...$PATCH_SHA"
          python --version
      - name: Install build tools and check lock consistency
        run: |
          python -m pip install build poetry==2.1.1
          poetry check --lock --directory src
      - name: Build wheel and source distribution
        run: python -m build src
      - name: Install built wheel in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install src/dist/*.whl pytest
          "$RUNNER_TEMP/runtime/bin/python" -m pip check
          cp src/offat/tests/test_cli.py "$RUNNER_TEMP/test_cli.py"
      - name: Exercise installed CLI outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          runtime/bin/python -c 'import offat; print(offat.__file__)'
          runtime/bin/python -m pytest -q test_cli.py
          runtime/bin/offat --help
          runtime/bin/offat --version
      - name: Run complete suite with installed runtime dependencies
        working-directory: src
        run: '"$RUNNER_TEMP/runtime/bin/python" -m pytest -q'
      - name: Record resolved runtime versions
        run: '"$RUNNER_TEMP/runtime/bin/python" -m pip freeze'
  baseline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: aa4a88640a99411dfce931e7187df921f9926dfb
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build unchanged baseline and install its wheel
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          python -m pip install build
          python -m build src
          python -m venv "$RUNNER_TEMP/baseline"
          "$RUNNER_TEMP/baseline/bin/python" -m pip install src/dist/*.whl pytest
          git show "$PATCH_SHA:src/offat/tests/test_cli.py" > "$RUNNER_TEMP/test_cli.py"
      - name: Prove regression fails because requests is missing
        working-directory: ${{ runner.temp }}
        run: |
          baseline/bin/python - <<'PY'
          import subprocess
          import xml.etree.ElementTree as ET
          result = subprocess.run([
              'baseline/bin/python', '-m', 'pytest', '-q', 'test_cli.py',
              '--junitxml=regression.xml',
          ])
          assert result.returncode == 1, result.returncode
          cases = ET.parse('regression.xml').findall('.//testcase')
          assert len(cases) == 1
          assert cases[0].find('error') is None
          failure = cases[0].find('failure')
          assert failure is not None
          assert "ModuleNotFoundError: No module named 'requests'" in failure.get('message', '')
          PY
